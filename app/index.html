<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ScamShield — scam detection, victim protection, evidence collection, and fraud reporting assistance."
    />
    <title>ScamShield</title>
  </head>
  <body>
    <div id="root">PLAIN HTML TEST - if you see this text, index.html loaded but JavaScript did not run</div>
    <script>
      document.getElementById('root').innerText = 'INLINE JS WORKED - basic JavaScript execution is fine';
    </script>
    <script src="/test.js"></script>
    <script>
      fetch('/')
        .then(function (r) { return r.text(); })
        .then(function (html) {
          document.getElementById('root').innerText = 'RAW HTML: ' + html;
        })
        .catch(function (e) {
          document.getElementById('root').innerText = 'HTML FETCH ERROR: ' + e.message;
        });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
